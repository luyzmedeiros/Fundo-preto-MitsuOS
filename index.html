<script>
    function verificarHorario() {
        const agora = new Date();
        const minutosAtuais = (agora.getHours() * 60) + agora.getMinutes();

        const inicioDia = 271; // 04:31
        const fimDia = 1079;   // 17:59

        if (minutosAtuais >= inicioDia && minutosAtuais <= fimDia) {
            window.location.replace("https://luyzmedeiros.github.io/Fundo-branco-MitsuOS/");
            return;
        }
    }
    verificarHorario();
</script>
