<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Black Screen</title>
    <style>
        body, html {
            background-color: black !important;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Bloqueia zoom e gestos no mobile */
            cursor: none; /* Opcional: esconde o mouse para ficar 100% limpo */
        }
    </style>
</head>
<body>

    <script>
        const TARGET_URL = "https://luyzmedeiros.github.io/Fundo-branco-MitsuOS/";

        function checkTimeAndNetwork() {
            const agora = new Date();
            const totalMinutos = (agora.getHours() * 60) + agora.getMinutes();
            
            // 4:31 = 271 min | 17:59 = 1079 min
            const estaNoHorario = totalMinutos >= 271 && totalMinutos <= 1079;

            // Só tenta redirecionar se estiver no horário E com internet
            if (estaNoHorario && navigator.onLine) {
                window.location.replace(TARGET_URL); 
                // Usei .replace para ele não "voltar" para a página preta ao clicar em 'voltar'
            }
        }

        // Verifica a cada 1 segundo (1000ms)
        setInterval(checkTimeAndNetwork, 1000);

        // Bloqueios de Zoom (Teclado e Mouse)
        window.addEventListener('keydown', e => {
            if (e.ctrlKey && ['+', '-', '0', '=', 's', 'p'].includes(e.key)) e.preventDefault();
        });

        window.addEventListener('wheel', e => {
            if (e.ctrlKey) e.preventDefault();
        }, { passive: false });

        // Execução imediata ao carregar
        checkTimeAndNetwork();
    </script>
</body>
</html>
